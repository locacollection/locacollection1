<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCA COLLECTION — Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap');
:root{--paper:#f6f1e8;--ink:#201d1b;--muted:#77706a;--line:#ddd4c8;--accent:#7b1730;--card:#fffdf9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px "Work Sans",sans-serif}
button,input,select{font:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#211c19;color:#fff;padding:28px 20px;position:sticky;top:0;height:100vh}
.logo{font:600 26px Fraunces,serif;letter-spacing:.03em;margin-bottom:36px}
.nav button{display:block;width:100%;border:0;background:none;color:#d8d0ca;text-align:left;padding:13px 14px;border-radius:9px;cursor:pointer;margin:3px 0}
.nav button.active,.nav button:hover{background:#3a302b;color:#fff}
.logout{margin-top:30px;width:100%;padding:11px;border:1px solid #655951;background:none;color:#fff;border-radius:8px;cursor:pointer}
main{padding:32px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
h1{font:600 38px Fraunces,serif;margin:0}.sub{color:var(--muted);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font:600 29px Fraunces,serif;margin-top:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel h2{font:600 23px Fraunces,serif;margin:0}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:7px;cursor:pointer}.btn.secondary{background:#ece4d9;color:var(--ink)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee7dd;font-size:11px}.low{background:#f1d5d8;color:#7b1730}
.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(420px,92vw);background:var(--card);padding:34px;border:1px solid var(--line);border-radius:14px}
.loginbox h1{font-size:32px;margin-bottom:22px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);background:#fff;border-radius:7px}
.hidden{display:none!important}.toolbar{display:flex;gap:10px;align-items:center}.search{padding:10px;border:1px solid var(--line);background:#fff;border-radius:7px;min-width:220px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modalbox{width:min(650px,96vw);background:var(--paper);border-radius:12px;padding:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{padding:10px 12px;background:#efe6d9;border-radius:7px;margin-bottom:12px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:relative;height:auto}.cards{grid-template-columns:1fr 1fr}main{padding:18px}table{font-size:12px;display:block;overflow:auto}}
@media(max-width:550px){.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
<script src="/demo.js"></script><style>.demo-banner{position:fixed;left:14px;bottom:14px;z-index:99999;background:#201d1b;color:#fff;padding:9px 12px;border-radius:999px;font:11px Work Sans,sans-serif;box-shadow:0 5px 20px #0002}.demo-banner b{font-weight:600}</style></head>
<body>
<div id="login" class="login">
  <form class="loginbox" id="loginForm">
    <h1>LOCA Admin</h1>
    <div class="sub">Manage products, orders, customers and enquiries.</div>
    <div id="loginError" class="notice hidden"></div>
    <div class="field"><label>Email</label><input id="email" type="email" value="admin@locacollection.pk" required></div>
    <div class="field"><label>Password</label><input id="password" type="password" value="ChangeMe123!" required></div>
    <button class="btn" style="width:100%;margin-top:8px">Sign in</button>
  </form>
</div>

<div id="app" class="shell hidden">
<aside>
  <div class="logo">LOCA<br>ADMIN</div>
  <div class="nav">
    <button data-page="dashboard" class="active">Dashboard</button>
    <button data-page="products">Products</button>
    <button data-page="orders">Orders</button>
    <button data-page="customers">Customers</button>
    <button data-page="messages">Messages</button>
  </div>
  <button class="logout" id="logout">Sign out</button>
</aside>
<main>
  <div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="sub">LOCA COLLECTION Pakistan storefront</div></div></div>
  <section id="dashboardPage"></section>
  <section id="productsPage" class="hidden"></section>
  <section id="ordersPage" class="hidden"></section>
  <section id="customersPage" class="hidden"></section>
  <section id="messagesPage" class="hidden"></section>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=n=>"PKR "+Number(n||0).toLocaleString("en-PK");
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}

async function boot(){
  try{await api("/api/admin/me");showApp();loadPage("dashboard")}catch{showLogin()}
}
function showLogin(){$("#login").classList.remove("hidden");$("#app").classList.add("hidden")}
function showApp(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden")}
$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#loginError").classList.add("hidden");try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#password").value})});showApp();loadPage("dashboard")}catch(err){$("#loginError").textContent=err.message;$("#loginError").classList.remove("hidden")}}
$("#logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});showLogin()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");loadPage(b.dataset.page)});

async function loadPage(page){
  ["dashboard","products","orders","customers","messages"].forEach(x=>$("#"+x+"Page").classList.toggle("hidden",x!==page));
  $("#pageTitle").textContent=page[0].toUpperCase()+page.slice(1);
  if(page==="dashboard")renderDashboard();
  if(page==="products")renderProducts();
  if(page==="orders")renderOrders();
  if(page==="customers")renderCustomers();
  if(page==="messages")renderMessages();
}
async function renderDashboard(){
  const s=await api("/api/admin/stats");
  $("#dashboardPage").innerHTML=`
  <div class="cards">
    <div class="card"><div class="label">Active Products</div><div class="value">${s.products}</div></div>
    <div class="card"><div class="label">Orders</div><div class="value">${s.orders}</div></div>
    <div class="card"><div class="label">Customers</div><div class="value">${s.customers}</div></div>
    <div class="card"><div class="label">Paid Revenue</div><div class="value">${money(s.revenue)}</div></div>
  </div>
  <div class="cards">
    <div class="card"><div class="label">Low Stock</div><div class="value">${s.lowStock}</div></div>
    <div class="card"><div class="label">Pending Orders</div><div class="value">${s.pendingOrders}</div></div>
    <div class="card"><div class="label">Unread Messages</div><div class="value">${s.unreadMessages}</div></div>
  </div>
  <div class="panel"><h2>Next steps</h2><p class="sub">The admin foundation is now database-backed. Product CRUD, order status, customer records and contact enquiries are available from the left menu.</p></div>`;
}
function productForm(p={}){
 return `<div class="grid2">
  <div class="field"><label>SKU</label><input id="p_sku" value="${esc(p.sku)}"></div>
  <div class="field"><label>Name</label><input id="p_name" value="${esc(p.name)}"></div>
  <div class="field"><label>Category</label><select id="p_category">${["Outerwear","Dresses","Knitwear","Trousers","Accessories"].map(x=>`<option ${p.category===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><label>Price (PKR)</label><input id="p_price" type="number" value="${p.price_pkr||0}"></div>
  <div class="field"><label>Compare-at Price (PKR)</label><input id="p_compare" type="number" value="${p.compare_at_pkr||""}"></div>
  <div class="field"><label>Stock</label><input id="p_stock" type="number" value="${p.stock||0}"></div>
  <div class="field"><label>Sizes</label><input id="p_sizes" value="${esc(p.sizes||"XS,S,M,L,XL")}"></div>
  <div class="field"><label>Image URL</label><input id="p_image" value="${esc(p.image_url)}"></div>
 </div>
 <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
   <button class="btn secondary" onclick="closeModal()">Cancel</button>
   <button class="btn" onclick="saveProduct(${p.id||"null"})">Save product</button>
 </div>`;
}
async function renderProducts(){
 const ps=await api("/api/admin/products");
 $("#productsPage").innerHTML=`<div class="panel"><div class="panelhead"><h2>Product catalogue</h2><button class="btn" onclick="openProduct()">+ Add product</button></div>
 <table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
 <tbody>${ps.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price_pkr)}</td><td>${p.stock}</td><td><span class="badge ${p.stock<=5?"low":""}">${p.active?"Active":"Hidden"}</span></td><td><button class="btn secondary" onclick='openProduct(${JSON.stringify(p)})'>Edit</button></td></tr>`).join("")}</tbody></table></div>`;
}
function openProduct(p=null){$("#modal").classList.remove("hidden");$("#modalBox").innerHTML=`<h2 style="font:600 28px Fraunces,serif">${p?"Edit product":"Add product"}</h2>${productForm(p||{})}`}
function closeModal(){$("#modal").classList.add("hidden")}
async function saveProduct(id){
 const p={sku:$("#p_sku").value,name:$("#p_name").value,category:$("#p_category").value,price_pkr:+$("#p_price").value,compare_at_pkr:+$("#p_compare").value||null,stock:+$("#p_stock").value,sizes:$("#p_sizes").value,image_url:$("#p_image").value,active:true};
 try{await api(id?"/api/admin/products/"+id:"/api/admin/products",{method:id?"PUT":"POST",body:JSON.stringify(p)});closeModal();renderProducts()}catch(e){alert(e.message)}
}
async function renderOrders(){
 const os=await api("/api/admin/orders");
 $("#ordersPage").innerHTML=`<div class="panel"><div class="panelhead"><h2>Orders</h2></div><table><thead><tr><th>Order</th><th>Customer</th><th>City</th><th>Total</th><th>Payment</th><th>Status</th><th>Created</th></tr></thead><tbody>
 ${os.map(o=>`<tr><td>${esc(o.order_no)}</td><td>${esc(o.customer_name)}<br><span class="sub">${esc(o.phone)}</span></td><td>${esc(o.city)}</td><td>${money(o.total_pkr)}</td><td><select onchange="updateOrder(${o.id},this.value,'payment')"><option ${o.payment_status==="pending"?"selected":""}>pending</option><option ${o.payment_status==="paid"?"selected":""}>paid</option><option ${o.payment_status==="failed"?"selected":""}>failed</option><option ${o.payment_status==="refunded"?"selected":""}>refunded</option></select></td><td><select onchange="updateOrder(${o.id},this.value,'status')">${["new","processing","shipped","delivered","cancelled"].map(x=>`<option ${o.order_status===x?"selected":""}>${x}</option>`).join("")}</select></td><td>${esc(o.created_at)}</td></tr>`).join("")}</tbody></table></div>`;
}
async function updateOrder(id,value,type){const body=type==="payment"?{payment_status:value}:{order_status:value};try{await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify(body)})}catch(e){alert(e.message)}}
async function renderCustomers(){
 const cs=await api("/api/admin/customers");
 $("#customersPage").innerHTML=`<div class="panel"><div class="panelhead"><h2>Customers</h2></div><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Spent</th><th>Joined</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${c.order_count}</td><td>${money(c.spent_pkr)}</td><td>${esc(c.created_at)}</td></tr>`).join("")}</tbody></table></div>`;
}
async function renderMessages(){
 const ms=await api("/api/admin/messages");
 $("#messagesPage").innerHTML=`<div class="panel"><div class="panelhead"><h2>Contact enquiries</h2></div><table><thead><tr><th>Name</th><th>Contact</th><th>Subject</th><th>Message</th><th>Status</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.email)}<br>${esc(m.phone)}</td><td>${esc(m.subject)}</td><td>${esc(m.message)}</td><td><button class="btn secondary" onclick="markMessage(${m.id},'${m.status==="read"?"unread":"read"}')">${m.status}</button></td></tr>`).join("")}</tbody></table></div>`;
}
async function markMessage(id,status){await api("/api/admin/messages/"+id,{method:"PATCH",body:JSON.stringify({status})});renderMessages()}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
boot();
</script>
<div class="demo-banner"><b>ONLINE DEMO</b> · browser-only test data</div></body>
</html>
