<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCA Collection / Admin Store Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/loca-rebuild.css">
<style>
.admin-preview{min-height:100vh;background:#f5efe7;color:#211916}.admin-preview-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px clamp(20px,5vw,72px);border-bottom:1px solid rgba(33,25,22,.14);background:#f8f1e8}.admin-preview-brand{display:flex;flex-direction:column;text-decoration:none;color:inherit}.admin-preview-brand strong{font:600 28px/1 'Playfair Display',serif;letter-spacing:.08em}.admin-preview-brand span{font-size:10px;letter-spacing:.18em;color:#806d60}.admin-preview-actions{display:flex;align-items:center;gap:10px}.admin-preview-pill{display:inline-flex;align-items:center;min-height:40px;padding:0 15px;border:1px solid #b89978;border-radius:999px;color:#3c2d26;text-decoration:none;font:600 12px/1 'DM Sans',sans-serif}.admin-preview-main{max-width:1320px;margin:0 auto;padding:54px clamp(20px,5vw,72px) 80px}.admin-preview-kicker{margin:0 0 10px;color:#9a654c;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.admin-preview-main h1{margin:0;font:500 clamp(38px,5vw,72px)/.98 'Playfair Display',serif}.admin-preview-intro{max-width:620px;margin:18px 0 36px;color:#76675d}.admin-preview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.admin-preview-toolbar input{width:min(360px,100%);min-height:42px;padding:0 14px;border:1px solid #d4c6b8;border-radius:5px;background:#fffaf4;font:inherit}.admin-preview-note{font-size:12px;color:#806d60}.admin-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}.admin-preview-card{overflow:hidden;background:#fffaf4;border:1px solid rgba(33,25,22,.12)}.admin-preview-image{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#e9ded2}.admin-preview-copy{padding:17px}.admin-preview-copy small{color:#9a654c;text-transform:uppercase;letter-spacing:.12em;font-size:10px}.admin-preview-copy h2{margin:8px 0;font:500 23px/1.05 'Playfair Display',serif}.admin-preview-copy p{min-height:40px;margin:0 0 15px;color:#76675d;font-size:13px;line-height:1.5}.admin-preview-price{display:block;margin-bottom:16px}.admin-preview-empty{padding:40px 0;color:#76675d}.admin-preview-error{color:#9b443c}.admin-preview-edit{width:100%;justify-content:center;cursor:pointer;background:transparent}.admin-preview-detail{padding:28px}.admin-preview-detail h2{margin-top:0;font:500 30px 'Playfair Display',serif}.admin-preview-detail p{color:#76675d;line-height:1.6}
</style>
</head>
<body class="admin-preview">
<header class="admin-preview-header"><a class="admin-preview-brand" href="admin.html"><strong>LOCA</strong><span>ADMIN STORE PREVIEW</span></a><div class="admin-preview-actions"><span id="adminIdentity" class="admin-preview-note">Checking admin session...</span><a class="admin-preview-pill" href="admin.html">↩ Admin Studio</a></div></header>
<main class="admin-preview-main"><p class="admin-preview-kicker">Read-only catalogue</p><h1>See the collection as it lives online.</h1><p class="admin-preview-intro">A presentation view for checking active products, imagery, descriptions and storefront layout. Ordering and customer account actions are disabled for administrators.</p><div class="admin-preview-toolbar"><input id="catalogueSearch" type="search" placeholder="Search the catalogue" aria-label="Search the catalogue"><span id="catalogueCount" class="admin-preview-note"></span></div><section id="catalogueGrid" class="admin-preview-grid" aria-live="polite"></section></main>
<dialog id="productDetail" class="admin-preview-detail"><button id="closeDetail" class="admin-preview-pill" type="button">Close</button><div id="productDetailBody"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=admin-store-1"></script><script type="module" src="js/admin-store.js?v=admin-store-1"></script>
</body>
</html>
