<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="LOCA Collection, Pakistani luxury fashion for modern life.">
<title>LOCA Collection</title>
<style>html,body{margin:0;min-height:100%;background:#f5efe7;color:#211916;font-family:DM Sans,Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}p{color:#76675d;font-size:14px}</style>
</head>
<body>
<main aria-live="polite"><p id="entryStatus">Opening LOCA Collection...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=entry-1"></script>
<script type="module">
import { supabase } from './js/supabaseClient.js';

const status = document.getElementById('entryStatus');
const destination = async () => {
  const { data: { session } = {}, error } = await supabase.auth.getSession();
  if (error || !session?.user) return 'customer-store.html';

  const { data: profile } = await supabase
    .from('profiles')
    .select('role')
    .eq('id', session.user.id)
    .maybeSingle();

  return profile?.role === 'admin' ? 'admin-store.html' : 'customer-store.html';
};

try {
  window.location.replace(await destination());
} catch (error) {
  console.error('LOCA entry routing failed:', error);
  status.textContent = 'LOCA Collection is temporarily unavailable.';
}
</script>
</body>
</html>
